[workspace]
members = [
	"analyzer",
	"audio-encoder",
	"completion",
	"encoder",
	"stitcher",
	"video-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
azure_core = "1.0.0"
azure_identity = { version = "1.0.0", features = ["tokio"] }
azure_storage_queue = "1.0.0"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", default-features = false, features = ["aws-lc-rs", "client", "rustls-tls"] }
serde_json = "1.0"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
video = { package = "video-core", path = "video-core" }
