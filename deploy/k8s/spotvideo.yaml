apiVersion: v1
kind: Namespace
metadata:
  name: spotvideo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spotvideo-worker
  namespace: spotvideo
  annotations:
    azure.workload.identity/client-id: "__WORKLOAD_CLIENT_ID__"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
subjects:
  - kind: ServiceAccount
    name: spotvideo-worker
    namespace: spotvideo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spotvideo-job-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spotvideo-config
  namespace: spotvideo
data:
  ServiceBus__Namespace: "__SERVICE_BUS_NAMESPACE__"
  ServiceBus__InputQueue: "video-submitted"
  ServiceBus__VideoResultQueue: "video-results"
  Storage__InputAccountName: "__INPUT_STORAGE_ACCOUNT__"
  Storage__InputContainer: "__INPUT_STORAGE_CONTAINER__"
  Storage__InputMountPath: "/mnt/input"
  Storage__OutputAccountName: "__OUTPUT_STORAGE_ACCOUNT__"
  Storage__OutputContainer: "__OUTPUT_STORAGE_CONTAINER__"
  Storage__OutputMountPath: "/mnt/output"
  Storage__WorkingContainer: "__OUTPUT_STORAGE_CONTAINER__"
  WorkloadIdentity__ClientId: "__WORKLOAD_CLIENT_ID__"
  Kubernetes__Namespace: "spotvideo"
  Images__Encoder: "__ACR_LOGIN_SERVER__/spotvideo-encoder:__IMAGE_TAG__"
  Images__Stitcher: "__ACR_LOGIN_SERVER__/spotvideo-stitcher:__IMAGE_TAG__"
  Images__Dotnet__Encoder: "__ACR_LOGIN_SERVER__/spotvideo-encoder:__DOTNET_MEDIA_IMAGE_TAG__"
  Images__Dotnet__Stitcher: "__ACR_LOGIN_SERVER__/spotvideo-stitcher:__DOTNET_MEDIA_IMAGE_TAG__"
  Images__Rust__Encoder: "__ACR_LOGIN_SERVER__/spotvideo-encoder:__RUST_MEDIA_IMAGE_TAG__"
  Images__Rust__Stitcher: "__ACR_LOGIN_SERVER__/spotvideo-stitcher:__RUST_MEDIA_IMAGE_TAG__"
  Encoding__MediaRuntimeDefault: "__MEDIA_RUNTIME__"
  Encoding__MaxParallelism: "32"
  Encoding__MinParallelismPerJob: "2"
  Encoding__ParallelizationStrategy: "fixed-duration"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spotvideo-analysis
  template:
    metadata:
      labels:
        app: spotvideo-analysis
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: analysis
          image: "__ACR_LOGIN_SERVER__/spotvideo-analysis:__IMAGE_TAG__"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          volumeMounts:
            - name: input-storage
              mountPath: /mnt/input
              readOnly: true
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: input-storage
          csi:
            driver: blob.csi.azure.com
            readOnly: true
            volumeAttributes:
              protocol: fuse2
              storageAccount: "__INPUT_STORAGE_ACCOUNT__"
              containerName: "__INPUT_STORAGE_CONTAINER__"
              ClientID: "__WORKLOAD_CLIENT_ID__"
              mountWithWorkloadIdentityToken: "true"
              mountOptions: "--allow-other --use-attr-cache=true --file-cache-timeout-in-seconds=300 --cancel-list-on-mount-seconds=10"
        - name: output-storage
          csi:
            driver: blob.csi.azure.com
            readOnly: false
            volumeAttributes:
              protocol: fuse2
              storageAccount: "__OUTPUT_STORAGE_ACCOUNT__"
              containerName: "__OUTPUT_STORAGE_CONTAINER__"
              ClientID: "__WORKLOAD_CLIENT_ID__"
              mountWithWorkloadIdentityToken: "true"
              mountOptions: "--allow-other --use-attr-cache=true --file-cache-timeout-in-seconds=30 --disable-writeback-cache=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-job-watcher
  namespace: spotvideo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotvideo-job-watcher
  template:
    metadata:
      labels:
        app: spotvideo-job-watcher
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: watcher
          image: "__ACR_LOGIN_SERVER__/spotvideo-completion:__IMAGE_TAG__"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: spotvideo-workload-identity
  namespace: spotvideo
spec:
  podIdentity:
    provider: azure-workload
    identityId: "__WORKLOAD_CLIENT_ID__"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  scaleTargetRef:
    name: spotvideo-analysis
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: "__SERVICE_BUS_NAMESPACE_SHORT__"
        queueName: video-submitted
        messageCount: "1"
        activationMessageCount: "0"
      authenticationRef:
        name: spotvideo-workload-identity