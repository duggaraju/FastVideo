apiVersion: v1
kind: Namespace
metadata:
  name: spotvideo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spotvideo-worker
  namespace: spotvideo
  annotations:
    azure.workload.identity/client-id: "__WORKLOAD_CLIENT_ID__"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
subjects:
  - kind: ServiceAccount
    name: spotvideo-worker
    namespace: spotvideo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spotvideo-job-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spotvideo-config
  namespace: spotvideo
data:
  ServiceBus__Namespace: "__SERVICE_BUS_NAMESPACE__"
  ServiceBus__InputQueue: "video-submitted"
  ServiceBus__CompletionQueue: "segment-completed"
  ServiceBus__StitchedQueue: "video-stitched"
  Storage__ServiceUri: "__STORAGE_SERVICE_URI__"
  Storage__TableServiceUri: "__TABLE_SERVICE_URI__"
  Storage__StateTable: "encodingstate"
  Kubernetes__Namespace: "spotvideo"
  Images__Encoder: "__ACR_LOGIN_SERVER__/spotvideo-encoder:__IMAGE_TAG__"
  Images__Stitcher: "__ACR_LOGIN_SERVER__/spotvideo-stitcher:__IMAGE_TAG__"
  Encoding__MaxParallelism: "32"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spotvideo-analysis
  template:
    metadata:
      labels:
        app: spotvideo-analysis
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: analysis
          image: "__ACR_LOGIN_SERVER__/spotvideo-analysis:__IMAGE_TAG__"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-completion
  namespace: spotvideo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spotvideo-completion
  template:
    metadata:
      labels:
        app: spotvideo-completion
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: completion
          image: "__ACR_LOGIN_SERVER__/spotvideo-completion:__IMAGE_TAG__"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: spotvideo-workload-identity
  namespace: spotvideo
spec:
  podIdentity:
    provider: azure-workload
    identityId: "__WORKLOAD_CLIENT_ID__"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  scaleTargetRef:
    name: spotvideo-analysis
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: "__SERVICE_BUS_NAMESPACE_SHORT__"
        queueName: video-submitted
        messageCount: "1"
        activationMessageCount: "0"
      authenticationRef:
        name: spotvideo-workload-identity
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: spotvideo-completion
  namespace: spotvideo
spec:
  scaleTargetRef:
    name: spotvideo-completion
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 20
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: "__SERVICE_BUS_NAMESPACE_SHORT__"
        queueName: segment-completed
        messageCount: "10"
        activationMessageCount: "0"
      authenticationRef:
        name: spotvideo-workload-identity