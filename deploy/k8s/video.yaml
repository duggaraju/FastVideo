apiVersion: v1
kind: Namespace
metadata:
  name: __KUBERNETES_NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __SERVICE_ACCOUNT_NAME__
  namespace: __KUBERNETES_NAMESPACE__
__SERVICE_ACCOUNT_ANNOTATIONS__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: video-job-manager
  namespace: __KUBERNETES_NAMESPACE__
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: video-job-manager
  namespace: __KUBERNETES_NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: __SERVICE_ACCOUNT_NAME__
    namespace: __KUBERNETES_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: video-job-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: video-config
  namespace: __KUBERNETES_NAMESPACE__
data:
  ServiceBus__Namespace: "__SERVICE_BUS_NAMESPACE__"
  ServiceBus__InputQueue: "video-submitted"
  ServiceBus__VideoResultQueue: "video-results"
  Storage__InputAccountName: "__INPUT_STORAGE_ACCOUNT__"
  Storage__InputContainer: "__INPUT_STORAGE_CONTAINER__"
  Storage__InputMountPath: "/mnt/input"
  Storage__OutputAccountName: "__OUTPUT_STORAGE_ACCOUNT__"
  Storage__OutputContainer: "__OUTPUT_STORAGE_CONTAINER__"
  Storage__OutputMountPath: "/mnt/output"
  Storage__WorkingContainer: "__OUTPUT_STORAGE_CONTAINER__"
  Storage__SubmissionQueue: "video-submitted"
  Storage__ResultQueue: "video-results"
  Storage__QueuePollSeconds: "3"
  Storage__QueueVisibilityTimeoutSeconds: "900"
  Storage__QueueVisibilityRenew: "true"
  Storage__QueueVisibilityRenewalSeconds: "120"
  Completion__PollSeconds: "10"
  WorkloadIdentity__ClientId: "__WORKLOAD_CLIENT_ID__"
  Kubernetes__Namespace: "__KUBERNETES_NAMESPACE__"
  Kubernetes__ServiceAccountName: "__SERVICE_ACCOUNT_NAME__"
  Kubernetes__PodLabels: '__POD_LABELS_JSON__'
  Kubernetes__MediaNodeSelectorSpot: '__MEDIA_NODE_SELECTOR_SPOT_JSON__'
  Kubernetes__MediaNodeSelectorRegular: '__MEDIA_NODE_SELECTOR_REGULAR_JSON__'
  Kubernetes__MediaTolerationsSpot: '__MEDIA_TOLERATIONS_SPOT_JSON__'
  Kubernetes__MediaTolerationsRegular: '__MEDIA_TOLERATIONS_REGULAR_JSON__'
  Storage__CsiDriver: "__STORAGE_CSI_DRIVER__"
  Storage__InputCsiVolumeAttributes: '__INPUT_CSI_VOLUME_ATTRIBUTES_JSON__'
  Storage__OutputCsiVolumeAttributes: '__OUTPUT_CSI_VOLUME_ATTRIBUTES_JSON__'
  Images__Encoder: "__IMAGE_REPOSITORY__/video-encoder-__MEDIA_RUNTIME__:__IMAGE_TAG__"
  Images__AudioEncoder: "__IMAGE_REPOSITORY__/video-audio-encoder-__MEDIA_RUNTIME__:__IMAGE_TAG__"
  Images__Stitcher: "__IMAGE_REPOSITORY__/video-stitcher-__MEDIA_RUNTIME__:__IMAGE_TAG__"
  Images__Dotnet__Encoder: "__IMAGE_REPOSITORY__/video-encoder-dotnet:__DOTNET_MEDIA_IMAGE_TAG__"
  Images__Dotnet__AudioEncoder: "__IMAGE_REPOSITORY__/video-audio-encoder-dotnet:__DOTNET_MEDIA_IMAGE_TAG__"
  Images__Dotnet__Stitcher: "__IMAGE_REPOSITORY__/video-stitcher-dotnet:__DOTNET_MEDIA_IMAGE_TAG__"
  Images__Rust__Encoder: "__IMAGE_REPOSITORY__/video-encoder-rust:__RUST_MEDIA_IMAGE_TAG__"
  Images__Rust__AudioEncoder: "__IMAGE_REPOSITORY__/video-audio-encoder-rust:__RUST_MEDIA_IMAGE_TAG__"
  Images__Rust__Stitcher: "__IMAGE_REPOSITORY__/video-stitcher-rust:__RUST_MEDIA_IMAGE_TAG__"
  Encoding__MediaRuntimeDefault: "__MEDIA_RUNTIME__"
  Encoding__MaxParallelism: "32"
  Encoding__MinParallelismPerJob: "2"
  Encoding__MaxAudioDurationSeconds: "__MAX_AUDIO_DURATION_SECONDS__"
  Encoding__ParallelizationStrategy: "fixed-duration"
  Encoding__LadderProfilesPath: "/etc/video/ladder/ladder-profiles.json"
  Encoding__EncodeJobActiveDeadlineSeconds: "21600"
  Encoding__AudioEncodeJobActiveDeadlineSeconds: "21600"
  Encoding__StitchJobActiveDeadlineSeconds: "21600"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: video-ladder-profiles
  namespace: __KUBERNETES_NAMESPACE__
data:
  ladder-profiles.json: |-
__LADDER_PROFILES_JSON__
__TRIGGER_AUTHENTICATION_RESOURCE__
