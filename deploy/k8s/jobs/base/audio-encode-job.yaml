apiVersion: batch/v1
kind: Job
metadata:
  name: video-audio-encoder-template
  labels:
    app.kubernetes.io/name: video-audio-encoder
    video/job-id: placeholder
  annotations:
    video/job-id: placeholder
    video.fastvideo/use-spot: "true"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-audio-encoder
        video/job-id: placeholder
    spec:
      serviceAccountName: video-worker
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      nodeSelector: {}
      tolerations: []
      volumes:
        - name: input-storage
          csi:
            driver: ""
            readOnly: true
            volumeAttributes: {}
        - name: output-storage
          csi:
            driver: ""
            readOnly: false
            volumeAttributes: {}
      containers:
        - name: audio-encoder
          image: video-audio-encoder-rust:latest
          env:
            - name: JOB_ID
              value: ""
            - name: SOURCE_VIDEO_URI
              value: https://example.invalid/input.mp4
            - name: AUDIO_BLOB_NAME
              value: placeholder/audio.m4a
            - name: AUDIO_CODEC
              value: aac
            - name: INPUT_STORAGE_ACCOUNT_NAME
              value: ""
            - name: INPUT_STORAGE_CONTAINER
              value: ""
            - name: INPUT_MOUNT_PATH
              value: /mnt/input
            - name: OUTPUT_MOUNT_PATH
              value: /mnt/output
          volumeMounts:
            - name: input-storage
              mountPath: /mnt/input
              readOnly: true
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
