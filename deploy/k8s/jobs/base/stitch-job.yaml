apiVersion: batch/v1
kind: Job
metadata:
  name: video-stitcher-template
  labels:
    app.kubernetes.io/name: video-stitcher
    video/job-id: placeholder
  annotations:
    video/job-id: placeholder
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-stitcher
        video/job-id: placeholder
    spec:
      serviceAccountName: video-worker
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      nodeSelector: {}
      tolerations: []
      volumes:
        - name: output-storage
          csi:
            driver: ""
            readOnly: false
            volumeAttributes: {}
      containers:
        - name: stitcher
          image: video-stitcher-rust:latest
          env:
            - name: JOB_ID
              value: ""
            - name: SEGMENT_COUNT
              value: "1"
            - name: AUDIO_BLOB_NAME
              value: placeholder/audio.m4a
            - name: OUTPUT_PATH
              value: https://example.invalid/output
            - name: OUTPUT_TYPE
              value: mp4
            - name: CALCULATE_VMAF
              value: "false"
            - name: OUTPUT_STORAGE_ACCOUNT_NAME
              value: ""
            - name: OUTPUT_STORAGE_CONTAINER
              value: ""
            - name: OUTPUT_MOUNT_PATH
              value: /mnt/output
          volumeMounts:
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
