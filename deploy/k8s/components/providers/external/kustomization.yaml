apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# External-cluster provider component. Every concrete scheduling, CSI, and
# identity value is injected by scripts/deploy.ps1 from the user's external
# deployment config, so the checked-in patches are intentionally inert.
patches:
  - path: patch-serviceaccount.yaml
  - path: patch-analyzer.yaml
  - path: patch-completion.yaml
