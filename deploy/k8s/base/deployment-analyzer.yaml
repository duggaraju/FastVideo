apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-analyzer
    spec:
      serviceAccountName: video-worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: analyzer
          image: video-analysis-storagequeue:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: video-config
          volumeMounts:
            - name: ladder-profiles
              mountPath: /etc/video/ladder
              readOnly: true
            - name: job-templates
              mountPath: /etc/video/job-templates
              readOnly: true
            - name: input-storage
              mountPath: /mnt/input
              readOnly: true
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: ladder-profiles
          configMap:
            name: video-ladder-profiles
        - name: job-templates
          configMap:
            name: video-job-templates
        - name: input-storage
          csi:
            driver: ""
            readOnly: true
            volumeAttributes: {}
        - name: output-storage
          csi:
            driver: ""
            readOnly: false
            volumeAttributes: {}
