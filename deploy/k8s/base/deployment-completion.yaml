apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-completion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: video-completion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-completion
    spec:
      serviceAccountName: video-worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: completion
          image: video-completion-storagequeue:latest
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: video-config
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
