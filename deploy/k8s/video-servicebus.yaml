apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-analysis-servicebus
  namespace: __KUBERNETES_NAMESPACE__
spec:
  replicas: __ANALYZER_REPLICAS__
  selector:
    matchLabels:
      app: video-analysis-servicebus
  template:
    metadata:
      labels:
        app: video-analysis-servicebus
__POD_LABELS_8__
    spec:
      serviceAccountName: __SERVICE_ACCOUNT_NAME__
__CONTROL_PLANE_NODE_SELECTOR__
__CONTROL_PLANE_TOLERATIONS__
      terminationGracePeriodSeconds: 60
      containers:
        - name: analysis
          image: "__IMAGE_REPOSITORY__/video-analysis-servicebus:__IMAGE_TAG__"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: video-config
          volumeMounts:
            - name: ladder-profiles
              mountPath: /etc/video/ladder
              readOnly: true
            - name: input-storage
              mountPath: /mnt/input
              readOnly: true
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: ladder-profiles
          configMap:
            name: video-ladder-profiles
        - name: input-storage
          csi:
            driver: "__STORAGE_CSI_DRIVER__"
            readOnly: true
            volumeAttributes:
__INPUT_CSI_VOLUME_ATTRIBUTES_14__
        - name: output-storage
          csi:
            driver: "__STORAGE_CSI_DRIVER__"
            readOnly: false
            volumeAttributes:
__OUTPUT_CSI_VOLUME_ATTRIBUTES_14__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-completion-servicebus
  namespace: __KUBERNETES_NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-completion-servicebus
  template:
    metadata:
      labels:
        app: video-completion-servicebus
__POD_LABELS_8__
    spec:
      serviceAccountName: __SERVICE_ACCOUNT_NAME__
__CONTROL_PLANE_NODE_SELECTOR__
__CONTROL_PLANE_TOLERATIONS__
      terminationGracePeriodSeconds: 60
      containers:
        - name: completion
          image: "__IMAGE_REPOSITORY__/video-completion-servicebus:__IMAGE_TAG__"
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: video-config
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: video-completion-servicebus
  namespace: __KUBERNETES_NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: video-completion-servicebus
__SCALER_RESOURCE__
