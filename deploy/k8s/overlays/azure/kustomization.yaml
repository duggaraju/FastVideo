apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Azure-specific provider component: adds Azure Workload Identity annotations/labels,
# AKS node selectors/tolerations for control-plane vs. spot/regular media nodes, and
# the Azure Blob CSI driver volume wiring. This component is transport-agnostic; a
# deploy-time generated overlay layers it on top of overlays/storagequeue or
# overlays/servicebus (scripts/deploy.ps1 picks the transport resource and adds this
# component, plus dynamic values and optional KEDA resources).
patches:
  - path: patch-serviceaccount.yaml
  - path: patch-analyzer.yaml
  - path: patch-completion.yaml
configMapGenerator:
  - name: video-config
    behavior: merge
    literals:
      - Kubernetes__PodLabels={"azure.workload.identity/use":"true"}
      - Kubernetes__MediaNodeSelectorSpot={"workload":"video-encoding","kubernetes.azure.com/scalesetpriority":"spot","kubernetes.io/os":"linux"}
      - Kubernetes__MediaNodeSelectorRegular={"workload":"video-encoding","kubernetes.azure.com/scalesetpriority":"regular","kubernetes.io/os":"linux"}
      - Kubernetes__MediaTolerationsSpot=[{"key":"kubernetes.azure.com/scalesetpriority","operator":"Equal","value":"spot","effect":"NoSchedule"}]
      - Kubernetes__MediaTolerationsRegular=[]
      - Storage__CsiDriver=blob.csi.azure.com
