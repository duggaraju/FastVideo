apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# External-cluster provider component. Unlike overlays/azure there are no
# repo-wide static defaults here: every node selector/toleration/CSI/identity
# value is supplied by the user's external deployment config JSON
# (see deploy/external-config.example.json). This component only establishes
# the patch *shape*; scripts/deploy.ps1 always layers a deploy-time generated
# overlay (deploy/.generated/<name>/) on top that patches in the user's real
# values, so the safe empty defaults here are intentionally inert.
patches:
  - path: patch-serviceaccount.yaml
  - path: patch-analyzer.yaml
  - path: patch-completion.yaml
