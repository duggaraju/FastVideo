apiVersion: v1
kind: Namespace
metadata:
  name: spotvideo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spotvideo-worker
  namespace: spotvideo
  annotations:
    azure.workload.identity/client-id: "e49dc6a5-cbe5-4417-9e89-9e4bf7e48fbe"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spotvideo-job-manager
  namespace: spotvideo
subjects:
  - kind: ServiceAccount
    name: spotvideo-worker
    namespace: spotvideo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spotvideo-job-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spotvideo-config
  namespace: spotvideo
data:
  ServiceBus__Namespace: "spotvideo-sb-soudinndket2a.servicebus.windows.net"
  ServiceBus__InputQueue: "video-submitted"
  ServiceBus__VideoResultQueue: "video-results"
  Storage__InputAccountName: "spotvideoinsoudinndket2a"
  Storage__InputContainer: "input"
  Storage__InputMountPath: "/mnt/input"
  Storage__OutputAccountName: "spotvideooutsoudinndket2"
  Storage__OutputContainer: "videos"
  Storage__OutputMountPath: "/mnt/output"
  Storage__WorkingContainer: "videos"
  WorkloadIdentity__ClientId: "e49dc6a5-cbe5-4417-9e89-9e4bf7e48fbe"
  Kubernetes__Namespace: "spotvideo"
  Images__Encoder: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-encoder:latest"
  Images__Stitcher: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-stitcher:latest"
  Images__Dotnet__Encoder: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-encoder:latest"
  Images__Dotnet__Stitcher: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-stitcher:latest"
  Images__Rust__Encoder: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-encoder:latest"
  Images__Rust__Stitcher: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-stitcher:latest"
  Encoding__MediaRuntimeDefault: "rust"
  Encoding__MaxParallelism: "32"
  Encoding__MinParallelismPerJob: "2"
  Encoding__ParallelizationStrategy: "fixed-duration"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spotvideo-analysis
  template:
    metadata:
      labels:
        app: spotvideo-analysis
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: analysis
          image: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-analysis:latest"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          volumeMounts:
            - name: input-storage
              mountPath: /mnt/input
              readOnly: true
            - name: output-storage
              mountPath: /mnt/output
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: input-storage
          csi:
            driver: blob.csi.azure.com
            readOnly: true
            volumeAttributes:
              protocol: fuse2
              storageAccount: "spotvideoinsoudinndket2a"
              containerName: "input"
              ClientID: "e49dc6a5-cbe5-4417-9e89-9e4bf7e48fbe"
              mountWithWorkloadIdentityToken: "true"
              mountOptions: "--allow-other --use-attr-cache=true --file-cache-timeout-in-seconds=300 --cancel-list-on-mount-seconds=10"
        - name: output-storage
          csi:
            driver: blob.csi.azure.com
            readOnly: false
            volumeAttributes:
              protocol: fuse2
              storageAccount: "spotvideooutsoudinndket2"
              containerName: "videos"
              ClientID: "e49dc6a5-cbe5-4417-9e89-9e4bf7e48fbe"
              mountWithWorkloadIdentityToken: "true"
              mountOptions: "--allow-other --use-attr-cache=true --file-cache-timeout-in-seconds=30 --disable-writeback-cache=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotvideo-job-watcher
  namespace: spotvideo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotvideo-job-watcher
  template:
    metadata:
      labels:
        app: spotvideo-job-watcher
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: spotvideo-worker
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.azure.com/mode: system
      terminationGracePeriodSeconds: 60
      containers:
        - name: watcher
          image: "spotvideoacrsoudinndket2a.azurecr.io/spotvideo-completion:latest"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spotvideo-config
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: spotvideo-workload-identity
  namespace: spotvideo
spec:
  podIdentity:
    provider: azure-workload
    identityId: "e49dc6a5-cbe5-4417-9e89-9e4bf7e48fbe"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: spotvideo-analysis
  namespace: spotvideo
spec:
  scaleTargetRef:
    name: spotvideo-analysis
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: "spotvideo-sb-soudinndket2a"
        queueName: video-submitted
        messageCount: "1"
        activationMessageCount: "0"
      authenticationRef:
        name: spotvideo-workload-identity
